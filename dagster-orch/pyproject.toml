[project]
name = "dagster_orch"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.4",
    "dagster-aws>=0.29.4",
    "dagster-dbt>=0.29",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pygris>=0.2.1",
    "python-dotenv",
    "requests",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_orch"
registry_modules = [
    "dagster_orch.components.*",
]


